# Nginx config for DocFlow frontend (SPA)
# Serves static files, proxies /api to backend, fallback to index.html for client-side routing

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Proxy API requests to backend (avoids 405 when frontend and API are on same host)
    location /api {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Static assets with cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check (optional)
    location /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
