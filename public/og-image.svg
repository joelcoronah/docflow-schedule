<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="150" fill="white" opacity="0.1"/>
  <circle cx="1100" cy="530" r="180" fill="white" opacity="0.1"/>
  
  <!-- Medical cross icon -->
  <g transform="translate(500, 180)">
    <!-- Vertical bar -->
    <rect x="80" y="0" width="40" height="180" fill="white" rx="8"/>
    <!-- Horizontal bar -->
    <rect x="30" y="50" width="140" height="40" fill="white" rx="8"/>
  </g>
  
  <!-- Title -->
  <text x="600" y="420" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="white" text-anchor="middle">
    DocFlow
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="480" font-family="Arial, sans-serif" font-size="32" fill="white" text-anchor="middle" opacity="0.9">
    Medical Practice Management System
  </text>
  
  <!-- Features -->
  <text x="600" y="540" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle" opacity="0.8">
    Appointments • Patient Records • Medical History
  </text>
</svg>
